<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App4Me — Coming Soon</title>
<meta name="description" content="App4Me — small, useful apps for everyday life. Coming soon.">
<link rel="stylesheet" href="style.css">
<style>
  .soon-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .soon-logo { width: 96px; height: 96px; border-radius: 24px; margin-bottom: 28px; }
  .soon-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; margin-bottom: 12px; }
  .soon-sub {
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: 700;
    margin-bottom: 20px;
  }
  .soon-text { color: var(--text-muted); max-width: 440px; margin-bottom: 36px; }
  .soon-links { display: flex; gap: 20px; font-size: 0.85rem; }
  .soon-links span { color: var(--text-muted); }
</style>
</head>
<body>

<div class="soon-wrap">
  <img src="app4me-logo-icon.png?v=1" alt="App4Me" class="soon-logo">
  <h1 class="soon-title">App4Me</h1>
  <p class="soon-sub">Coming soon</p>
  <p class="soon-text">
    Small, useful apps for everyday life — built by a small studio in India. More on the way.
  </p>
  <div class="soon-links">
    <span>support@app4me.in</span>
  </div>
</div>

</body>
</html>
